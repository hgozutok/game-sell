# VPS uretim kurulumu — digital-game-store + storefront + postgres + redis + worker
#
# Kullanim (proje kokunde):
#   docker compose up -d --build                  # .env otomatik okunur
#   docker compose --env-file .env.production up -d --build   # ayri env dosyasi
#
# Notlar:
# - Tek komut dosyasi: docker-compose.yml (eski docker-compose.prod.yml kaldirildi).
# - NEXT_PUBLIC_MEDUSA_BACKEND_URL build-arg olarak girilir (tarayici bundle'ina
#   islenir). Ayni domain uzerinde reverse proxy kullanacaksan / ile baslayabilir,
#   yoksa https://api.senindomain.com gibi acik bir adres olmali.
# - Migration'lar backend konteyneri baslarken otomatik uygulanir.
# - Veritabani verisi proje klasoru icinde: ./db-data/postgres. Klasoru komple
#   kopyalayip baska bir sunucuya yuklediginizde mevcut veri de beraberinde
#   gelir; db-perms servisi dosya sahipligini postgres kullanicisina cevirir.

services:
  # Proje klasoru zip/scp ile baska makineye tasindiginda dosyalar root'a
  # ait olabilir. Postgres uid 70 (alpine) ile calistigi icin PGDATA'nin
  # sahibi olmali. Bu one-shot servis duzeltip cikar.
  db-perms:
    image: postgres:16-alpine
    container_name: dgs-db-perms
    restart: "no"
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "mkdir -p /var/lib/postgresql/data && chown -R postgres:postgres /var/lib/postgresql/data || true; chmod 700 /var/lib/postgresql/data || true"
    volumes:
      - ./db-data/postgres:/var/lib/postgresql/data

  postgres:
    image: postgres:16-alpine
    container_name: dgs-postgres
    restart: unless-stopped
    depends_on:
      db-perms:
        condition: service_completed_successfully
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-medusa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medusa_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-medusa-digital-store}
    volumes:
      - ./db-data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medusa} -d ${POSTGRES_DB:-medusa-digital-store}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # VPS'te disariya acma; sadece compose agi
    expose:
      - "5432"

  redis:
    image: redis:7-alpine
    container_name: dgs-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    expose:
      - "6379"

  backend:
    build:
      context: ./digital-game-store
      args:
        # Admin paneli bundle'ina build zamaninda islenir
        MEDUSA_BACKEND_URL: ${MEDUSA_BACKEND_URL:-http://localhost:9000}
    container_name: dgs-backend
    restart: unless-stopped
    # Sunucu DNS'i sallantili oldugunda docker servis adlari (redis/postgres)
    # EAI_AGAIN veriyor; guvenilir public yedek DNS'ler ekle.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-medusa}:${POSTGRES_PASSWORD:-medusa_change_me}@postgres:5432/${POSTGRES_DB:-medusa-digital-store}?sslmode=disable
      REDIS_URL: redis://redis:6379
      PORT: 9000
      JWT_SECRET: ${JWT_SECRET}
      COOKIE_SECRET: ${COOKIE_SECRET}
      MEDUSA_BACKEND_URL: ${MEDUSA_BACKEND_URL:-http://localhost:9000}
      # E-posta sablonlarindaki site adresi ve dogrulama baglantilari
      STORE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      # --- E-posta / SMTP (panelden kaydedilen deger bu ortam degerini ezer) ---
      SMTP_ENABLED: ${SMTP_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      # Bazi saglayicilarin (Gmail) dokumantasyonundaki adlar; ikisi de kabul edilir
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_TLS_REJECT_UNAUTHORIZED: ${SMTP_TLS_REJECT_UNAUTHORIZED:-true}
      # false: SMTP olsa bile kayit e-postasi dogrulamasi istenmez (DKIM'siz gecici SMTP icin)
      AUTH_EMAIL_VERIFICATION_REQUIRED: ${AUTH_EMAIL_VERIFICATION_REQUIRED:-true}
      # TLS sonlandirmasi yoksa false yapin; HTTPS'te varsayilan secure=true
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      STORE_CORS: ${STORE_CORS:-http://localhost:3000,http://localhost:13000,http://localhost:13100,https://hupiplay.uk,https://www.hupiplay.uk,http://23.81.36.36,https://23.81.36.36}
      ADMIN_CORS: ${ADMIN_CORS:-http://localhost:7001,http://localhost:3000,http://localhost:13000,http://localhost:13100,https://hupiplay.uk,https://www.hupiplay.uk,http://23.81.36.36,https://23.81.36.36}
      AUTH_CORS: ${AUTH_CORS:-http://localhost:9000,http://localhost:3000,http://localhost:13000,http://localhost:13100,https://hupiplay.uk,https://www.hupiplay.uk,http://23.81.36.36,https://23.81.36.36}
      # :? -> anahtar tanimli degilse compose hata verir (sessizce bos anahtarla
      # ayaga kalkip tum sync'leri 401'e dusurmesin).
      KINGUIN_API_KEY: ${KINGUIN_API_KEY:?KINGUIN_API_KEY tanimli degil (.env)}
      # ESA API gateway; api.kinguin.net kullanilan eski/yanlis host.
      KINGUIN_BASE_URL: ${KINGUIN_BASE_URL:-https://gateway.kinguin.net/esa/api}
      KINGUIN_ORDER_MODE: ${KINGUIN_ORDER_MODE:-readonly}
      # --- Odeme saglayicilari (bos ise saglayici yuklenmez) ---
      STRIPE_API_KEY: ${STRIPE_API_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
      PAYPAL_ENV: ${PAYPAL_ENV:-sandbox}
      PAYPAL_API_BASE_URL: ${PAYPAL_API_BASE_URL:-}
      PAYPAL_WEBHOOK_ID: ${PAYPAL_WEBHOOK_ID:-}
      MOLLIE_API_KEY: ${MOLLIE_API_KEY:-}
      MOLLIE_ENABLED: ${MOLLIE_ENABLED:-false}
      DIGITAL_KEY_ENCRYPTION_KEY: ${DIGITAL_KEY_ENCRYPTION_KEY}
      FULFILL_MAX_RETRIES: ${FULFILL_MAX_RETRIES:-4}
    ports:
      # Yalnizca loopback'e baglanir: disariya acilan tek yol Nginx (443).
      - "127.0.0.1:${BACKEND_PORT:-9000}:9000"

  worker:
    build:
      context: ./digital-game-store
      args:
        MEDUSA_BACKEND_URL: ${MEDUSA_BACKEND_URL:-http://localhost:9000}
    container_name: dgs-worker
    restart: unless-stopped
    dns:
      - 1.1.1.1
      - 8.8.8.8
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-medusa}:${POSTGRES_PASSWORD:-medusa_change_me}@postgres:5432/${POSTGRES_DB:-medusa-digital-store}?sslmode=disable
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      COOKIE_SECRET: ${COOKIE_SECRET}
      KINGUIN_API_KEY: ${KINGUIN_API_KEY:?KINGUIN_API_KEY tanimli degil (.env)}
      KINGUIN_BASE_URL: ${KINGUIN_BASE_URL:-https://gateway.kinguin.net/esa/api}
      DIGITAL_KEY_ENCRYPTION_KEY: ${DIGITAL_KEY_ENCRYPTION_KEY}
      STORE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      # Siparis/teslimat e-postalari worker'dan gonderilir
      SMTP_ENABLED: ${SMTP_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      # Bazi saglayicilarin (Gmail) dokumantasyonundaki adlar; ikisi de kabul edilir
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_TLS_REJECT_UNAUTHORIZED: ${SMTP_TLS_REJECT_UNAUTHORIZED:-true}
      WORKER_MODE: worker
    command: ["node", "dist/workers/worker.js"]

  storefront:
    build:
      context: ./storefront
      args:
        # Tarayici bundle'ina islenir — VPS'te backend'in PUBLIC adresi olmali
        NEXT_PUBLIC_MEDUSA_BACKEND_URL: ${NEXT_PUBLIC_MEDUSA_BACKEND_URL:-http://localhost:9000}
        NEXT_PUBLIC_PUBLISHABLE_KEY: ${NEXT_PUBLIC_PUBLISHABLE_KEY}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    container_name: dgs-storefront
    restart: unless-stopped
    dns:
      - 1.1.1.1
      - 8.8.8.8
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_MEDUSA_BACKEND_URL: ${NEXT_PUBLIC_MEDUSA_BACKEND_URL:-http://localhost:9000}
      # Runtime'da server-side istekler icin publishable key (sitemap/llms.txt)
      NEXT_PUBLIC_PUBLISHABLE_KEY: ${NEXT_PUBLIC_PUBLISHABLE_KEY}
      # Server-side istekler (sitemap, generateMetadata) compose agindan gider
      MEDUSA_BACKEND_URL_SERVER: http://backend:9000
      # Canonical/sitemap URL'leri icin — public site adresi
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      PORT: 3000
    ports:
      # Yalnizca loopback'e baglanir: magazaya erisim Cloudflare Tunnel
      # (veya opsiyonel yerel Nginx) uzerinden yapilir.
      - "127.0.0.1:${STOREFRONT_PORT:-3000}:3000"

volumes:
  # Postgres artik bind mount (./db-data/postgres) — isimli volume yok.
  redis_data:
